<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color-Changing Stopwatch</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: radial-gradient(circle at center, #1e0033, #000);
    font-family: 'Poppins', sans-serif;
  }
  .stopwatch-container {
    text-align: center;
  }
  .circle {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 25px;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    position: relative;
    transition: background 0.6s ease;
  }
  .circle::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #121212 60%, transparent 100%);
    border-radius: 50%;
    box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
  }
  #time {
    position: absolute;
    color: #ffffff;
    font-size: 26px;
    font-weight: 600;
    z-index: 2;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .buttons button {
    padding: 10px 22px;
    margin: 6px;
    border: none;
    background: linear-gradient(90deg, #ff7e5f, #feb47b);
    color: white;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
  }
  .buttons button:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 15px rgba(255, 126, 95, 0.5);
  }
</style>
</head>
<body>
<div class="stopwatch-container">
  <div class="circle" id="circle">
    <span id="time">00:00:00</span>
  </div>
  <div class="buttons">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
</div>
<script>
let timer;
let isRunning = false;
let [hours, minutes, seconds] = [0, 0, 0];
const timeDisplay = document.getElementById('time');
const circle = document.getElementById('circle');
const startBtn = document.getElementById('start');
const pauseBtn = document.getElementById('pause');
const resetBtn = document.getElementById('reset');
const gradients = [
  "conic-gradient(#ff7e5f, #feb47b)",
  "conic-gradient(#00c6ff, #0072ff)",
  "conic-gradient(#f7971e, #ffd200)",
  "conic-gradient(#43cea2, #185a9d)",
  "conic-gradient(#ff0099, #493240)",
  "conic-gradient(#00b09b, #96c93d)",
  "conic-gradient(#fc466b, #3f5efb)",
  "conic-gradient(#ee9ca7, #ffdde1)"
];
let colorIndex = 0;
function updateTime() {
    seconds++;
    if (seconds === 60) {
        seconds = 0;
        minutes++;
    }
    if (minutes === 60) {
        minutes = 0;
        hours++;
    }
    const h = hours.toString().padStart(2, '0');
    const m = minutes.toString().padStart(2, '0');
    const s = seconds.toString().padStart(2, '0');
    timeDisplay.textContent = `${h}:${m}:${s}`;
    circle.style.background = gradients[colorIndex];
    colorIndex = (colorIndex + 1) % gradients.length;
}
startBtn.addEventListener('click', () => {
    if (!isRunning) {
        timer = setInterval(updateTime, 1000);
        isRunning = true;
    }
});
pauseBtn.addEventListener('click', () => {
    clearInterval(timer);
    isRunning = false;
});
resetBtn.addEventListener('click', () => {
    clearInterval(timer);
    isRunning = false;
    hours = minutes = seconds = 0;
    colorIndex = 0;
    timeDisplay.textContent = "00:00:00";
    circle.style.background = gradients[0];
});
</script>
</body>
</html>
